# Deployment for a single host (e.g. a Hetzner VPS).
#
# Nothing here can place a real order: there is no live execution path in this
# image. `paper` is the long-running service, and it simulates fills against
# live public market data.

x-common: &common
  build: .
  env_file: [.env]
  volumes:
    - ./data/snapshots:/app/data/snapshots
    - ./state:/app/state
    - ./config:/app/config:ro

services:
  # One-shot: pin a market-data snapshot. Needs outbound exchange access.
  fetch:
    <<: *common
    command: python -m tradebot.run.fetch
    restart: "no"

  # One-shot: measure a strategy against a pinned snapshot.
  backtest:
    <<: *common
    command: python -m tradebot.run.backtest --strategy momentum
    restart: "no"

  # One-shot: walk-forward validation across the parameter grid.
  walkforward:
    <<: *common
    command: python -m tradebot.run.walkforward --strategy momentum
    restart: "no"

  # One-shot: the test suite, as a deployment smoke check.
  test:
    <<: *common
    command: pytest -q
    restart: "no"

  # One-shot: full dry run of the paper daemon against pinned data. Exercises
  # the journal, startup reconciliation and risk gate at CPU speed instead of
  # one bar an hour. Run this before trusting a deployment.
  paper-replay:
    <<: *common
    command: >
      python -m tradebot.run.paper --replay --strategy momentum
      --run-name dryrun --max-bars 2000
    restart: "no"

  # Long-running paper trader. Simulated fills against live public quotes;
  # there is no live order path in this image.
  #
  # Two things here are load-bearing, not boilerplate:
  #
  # `restart: unless-stopped` plus the halt sentinel. The daemon exits 2 when
  # the risk gate halts it, and Compose will restart it — so the sentinel in
  # state/ is what stops it resuming trading seconds later. A breaker that
  # trips and immediately re-closes is decoration. Clearing it is deliberate:
  #   docker compose run --rm paper python -m tradebot.run.paper --clear-halt
  #
  # The healthcheck runs the watchdog, because a process cannot report its own
  # death. It goes unhealthy on a stale heartbeat or a halt, which is the
  # signal an alerting integration should hang off. Compose will not page
  # anyone by itself — wiring `--watchdog` to something that reaches a human is
  # the last item of DESIGN.md section 7 and is the operator's job.
  paper:
    <<: *common
    command: python -m tradebot.run.paper --strategy momentum
    restart: unless-stopped
    profiles: ["paper"]
    healthcheck:
      test: ["CMD", "python", "-m", "tradebot.run.paper", "--watchdog"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 2h
