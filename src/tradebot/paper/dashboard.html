<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tradebot paper runs</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --muted:       #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --series-1:    #2a78d6;
    --good:        #0ca30c;
    --critical:    #d03b3b;
    --delta-up:    #006300;
    --delta-down:  #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface-1:   #1a1a19;
      --text-primary:#f0efec;
      --text-secondary:#c3c2b7;
      --muted:       #898781;
      --grid:        #2c2c2a;
      --baseline:    #383835;
      --border:      rgba(255,255,255,0.10);
      --series-1:    #3987e5;
      --good:        #0ca30c;
      --critical:    #d03b3b;
      --delta-up:    #0ca30c;
      --delta-down:  #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 8px; margin: 16px 0 12px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 8px; padding: 6px 12px;
    cursor: pointer; font: inherit; font-size: 13px;
  }
  .tab.active { color: var(--text-primary); border-color: var(--series-1); font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--surface-1);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--text-secondary);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 22px; font-weight: 650; margin-top: 2px; }
  .tile .d { font-size: 12px; margin-top: 2px; color: var(--text-secondary); }
  .up   { color: var(--delta-up); }
  .down { color: var(--delta-down); }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--text-secondary); font-weight: 600; }
  #chartbox { position: relative; }
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    white-space: nowrap; z-index: 2;
  }
  #tooltip .t { color: var(--muted); }
  #tooltip .e { font-weight: 650; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; padding: 4px 8px;
       border-bottom: 1px solid var(--grid); }
  td { padding: 5px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; }
  .empty { color: var(--muted); padding: 14px 4px; }
  .banner {
    border: 1px solid var(--critical); color: var(--critical);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-weight: 600;
    background: var(--surface-1);
  }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  text.axis { fill: var(--muted); font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>tradebot &mdash; paper runs</h1>
    <span class="sub" id="refreshed"></span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="empty">Loading&hellip;</div></div>
  <footer>Read-only view of <code>state/paper/</code>. Paper results prove plumbing,
    not profitability &mdash; see DESIGN.md. Auto-refreshes every 30&nbsp;s.</footer>
</div>

<script>
"use strict";
let DATA = [];
let ACTIVE = null;

const fmt$  = v => v == null ? "–" : v.toLocaleString("en-US", {maximumFractionDigits: 2});
const fmtPct = v => (v >= 0 ? "+" : "") + (100 * v).toFixed(2) + "%";
const fmtQty = v => v.toLocaleString("en-US", {maximumFractionDigits: 6});
const fmtTs = s => s ? s.replace("T", " ").slice(0, 16) + " UTC" : "–";

async function load() {
  try {
    const r = await fetch("/api/data");
    DATA = await r.json();
  } catch (e) {
    document.getElementById("content").innerHTML =
      '<div class="empty">Cannot reach the dashboard server.</div>';
    return;
  }
  if (!DATA.length) {
    document.getElementById("content").innerHTML =
      '<div class="empty">No paper runs found under state/paper/ yet. ' +
      'Start one: <code>python -m tradebot.run.paper --strategy momentum</code></div>';
    return;
  }
  if (!ACTIVE || !DATA.some(d => d.name === ACTIVE)) ACTIVE = DATA[0].name;
  document.getElementById("refreshed").textContent =
    "updated " + new Date().toISOString().slice(11, 19) + " UTC";
  renderTabs();
  render(DATA.find(d => d.name === ACTIVE));
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  for (const d of DATA) {
    const b = document.createElement("button");
    b.className = "tab" + (d.name === ACTIVE ? " active" : "");
    b.textContent = d.name + (d.halted ? " ⛔" : "");
    b.onclick = () => { ACTIVE = d.name; renderTabs(); render(d); };
    el.appendChild(b);
  }
}

function statusChip(d) {
  if (d.halted) return "";  // the banner carries it
  const age = d.heartbeat_age_s;
  const alive = age != null && age < 180;
  const color = alive ? "var(--good)" : "var(--critical)";
  const label = alive ? `❤ heartbeat ${Math.round(age)}s ago`
                      : age == null ? "✖ no heartbeat" : `✖ heartbeat ${Math.round(age)}s ago (stale)`;
  return `<span class="chip"><span class="dot" style="background:${color}"></span>${label}</span>`;
}

function render(d) {
  const pnlCls = d.pnl_pct >= 0 ? "up" : "down";
  const invested = (d.equity != null && d.cash != null) ? d.equity - d.cash : null;

  let html = "";
  if (d.halted) html += `<div class="banner">⛔ HALTED — ${esc(d.halted)}<br>
    <span style="font-weight:400">Resume is a human decision: <code>python -m tradebot.run.paper --clear-halt</code></span></div>`;

  html += `<div class="chips">
    ${statusChip(d)}
    <span class="chip">${esc(d.strategy)}</span>
    <span class="chip">run ${esc(d.run_id)}</span>
    <span class="chip">bars: ${d.timeframe}, last ${fmtTs(d.last_bar)}</span>
  </div>`;

  html += `<div class="tiles">
    <div class="tile"><div class="k">Equity</div><div class="v">$${fmt$(d.equity)}</div>
      <div class="d ${pnlCls}">${fmtPct(d.pnl_pct)} vs start</div></div>
    <div class="tile"><div class="k">Cash</div><div class="v">$${fmt$(d.cash)}</div>
      <div class="d">invested: $${fmt$(invested)}</div></div>
    <div class="tile"><div class="k">Max drawdown</div><div class="v">${(100*d.max_drawdown).toFixed(1)}%</div>
      <div class="d">from the run's peak</div></div>
    <div class="tile"><div class="k">Trades</div><div class="v">${d.n_fills}</div>
      <div class="d">fees paid: $${fmt$(d.fees_paid)}</div></div>
    <div class="tile"><div class="k">Bars seen</div><div class="v">${d.n_marks}</div>
      <div class="d">decisions: ${d.n_decisions}</div></div>
  </div>`;

  html += `<div class="card"><h2>Equity — $ over time</h2>
    <div id="chartbox">${chartSVG(d)}<div id="tooltip"></div></div></div>`;

  html += `<div class="card"><h2>Positions now</h2>${positionsTable(d)}</div>`;
  html += `<div class="card"><h2>Latest trades (newest first, up to 100)</h2>${fillsTable(d)}</div>`;

  document.getElementById("content").innerHTML = html;
  wireHover(d);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// ---------------------------------------------------------------- chart

const W = 1000, H = 300, PAD = {l: 56, r: 12, t: 10, b: 24};
let PTS = [];  // [{x, y, ts, v}] in SVG coords, for hover

function chartSVG(d) {
  const curve = d.equity_curve || [];
  if (curve.length < 2) {
    return `<div class="empty">Not enough bars yet for a curve — the daemon marks
      equity once per closed bar (${esc(d.timeframe)}).</div>`;
  }
  const t0 = Date.parse(curve[0][0]), t1 = Date.parse(curve[curve.length - 1][0]);
  let lo = Math.min(d.initial_equity, ...curve.map(p => p[1]));
  let hi = Math.max(d.initial_equity, ...curve.map(p => p[1]));
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const padY = (hi - lo) * 0.06; lo -= padY; hi += padY;

  const x = t => PAD.l + (W - PAD.l - PAD.r) * (t - t0) / Math.max(1, t1 - t0);
  const y = v => H - PAD.b - (H - PAD.t - PAD.b) * (v - lo) / (hi - lo);

  PTS = curve.map(p => ({ts: p[0], v: p[1], x: x(Date.parse(p[0])), y: y(p[1])}));
  const path = PTS.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join("");

  // ~4 horizontal gridlines on round-ish values.
  let grid = "", labels = "";
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = lo + (hi - lo) * i / steps;
    const yy = y(v).toFixed(1);
    grid += `<line x1="${PAD.l}" x2="${W - PAD.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    labels += `<text class="axis" x="${PAD.l - 8}" y="${+yy + 4}" text-anchor="end">$${Math.round(v).toLocaleString()}</text>`;
  }
  // 4 time labels.
  for (let i = 0; i <= 3; i++) {
    const t = t0 + (t1 - t0) * i / 3;
    const anchor = i === 0 ? "start" : i === 3 ? "end" : "middle";
    labels += `<text class="axis" x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${new Date(t).toISOString().slice(0, 10)}</text>`;
  }
  const base = y(d.initial_equity).toFixed(1);

  return `<svg id="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img"
       aria-label="Equity in dollars over time for run ${esc(d.name)}">
    ${grid}
    <line x1="${PAD.l}" x2="${W - PAD.r}" y1="${base}" y2="${base}"
          stroke="var(--baseline)" stroke-width="1" stroke-dasharray="4 4"/>
    <text class="axis" x="${W - PAD.r}" y="${+base - 5}" text-anchor="end">start $${Math.round(d.initial_equity).toLocaleString()}</text>
    <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    <line id="xhair" y1="${PAD.t}" y2="${H - PAD.b}" stroke="var(--baseline)" stroke-width="1" style="display:none"/>
    <circle id="xdot" r="4" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2" style="display:none"/>
    ${labels}
  </svg>`;
}

function wireHover() {
  const svg = document.getElementById("chart");
  if (!svg || !PTS.length) return;
  const tip = document.getElementById("tooltip");
  const xhair = document.getElementById("xhair");
  const xdot = document.getElementById("xdot");
  const box = document.getElementById("chartbox");

  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) * W / r.width;
    let best = PTS[0];
    for (const p of PTS) if (Math.abs(p.x - mx) < Math.abs(best.x - mx)) best = p;
    xhair.setAttribute("x1", best.x); xhair.setAttribute("x2", best.x);
    xhair.style.display = "";
    xdot.setAttribute("cx", best.x); xdot.setAttribute("cy", best.y);
    xdot.style.display = "";
    tip.innerHTML = `<span class="t">${fmtTs(best.ts)}</span><br><span class="e">$${fmt$(best.v)}</span>`;
    tip.style.display = "block";
    const bx = box.getBoundingClientRect();
    const px = best.x * r.width / W + r.left - bx.left;
    const py = best.y * r.height / H + r.top - bx.top;
    tip.style.left = Math.min(px + 12, bx.width - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.max(py - tip.offsetHeight - 10, 0) + "px";
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none"; xhair.style.display = "none"; xdot.style.display = "none";
  });
}

// ---------------------------------------------------------------- tables

function positionsTable(d) {
  const pos = Object.entries(d.positions || {});
  const rows = pos.map(([s, q]) =>
    `<tr><td>${esc(s)}</td><td class="num">${fmtQty(q)}</td></tr>`).join("");
  const cash = `<tr><td style="color:var(--muted)">cash (USDT)</td>
    <td class="num">${fmt$(d.cash)}</td></tr>`;
  if (!pos.length) return `<table><thead><tr><th>Asset</th><th class="num">Quantity</th></tr></thead>
    <tbody>${cash}</tbody></table>
    <div class="empty" style="padding-top:8px">No open positions — the strategy is sitting in cash.</div>`;
  return `<table><thead><tr><th>Asset</th><th class="num">Quantity</th></tr></thead>
    <tbody>${rows}${cash}</tbody></table>`;
}

function fillsTable(d) {
  const fills = (d.fills || []).slice(0, 100);
  if (!fills.length) return '<div class="empty">No trades yet.</div>';
  const rows = fills.map(f => {
    const buy = f.side === "buy";
    const cls = buy ? "up" : "down";
    const arrow = buy ? "▲" : "▼";
    return `<tr>
      <td>${fmtTs(f.ts)}</td>
      <td class="${cls}">${arrow} ${buy ? "BUY" : "SELL"}</td>
      <td>${esc(f.symbol)}</td>
      <td class="num">${fmtQty(f.qty)}</td>
      <td class="num">$${fmt$(f.price)}</td>
      <td class="num">$${f.fee.toFixed(2)}</td>
      <td class="num">$${fmt$(f.qty * f.price)}</td>
    </tr>`;
  }).join("");
  return `<table><thead><tr><th>Filled</th><th>Side</th><th>Symbol</th>
    <th class="num">Qty</th><th class="num">Price</th><th class="num">Fee</th>
    <th class="num">Notional</th></tr></thead><tbody>${rows}</tbody></table>`;
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
